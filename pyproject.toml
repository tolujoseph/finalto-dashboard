[project]
name = "finalto-dashboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "quart>=0.19.0",
    "dash>=2.14.0",
    "plotly>=5.17.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
